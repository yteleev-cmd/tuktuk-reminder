<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Тук-Тук</title>


<script src="https://telegram.org/js/telegram-web-app.js"></script>


<link rel="stylesheet" href="./css/style.css">


</head>


<body>


<div class="app">



<header class="header">


<div class="logo">


<div class="logo-icon">
🔔
</div>



<div>


<div class="logo-title">
Тук-Тук
</div>


<div class="logo-subtitle">
Мои напоминания
</div>


</div>


</div>




<button
type="button"
class="refresh"
onclick="loadReminders()">

↻

</button>



</header>







<div class="tabs">



<button
type="button"
class="tab active"
onclick="setTab('all',this)">

Все

</button>




<button
type="button"
class="tab"
onclick="setTab('today',this)">

Сегодня

</button>




<button
type="button"
class="tab"
onclick="setTab('future',this)">

Позже

</button>



</div>







<main id="content">

<div class="loader"></div>

</main>







<button
type="button"
class="add-button"
onclick="openAddReminder()">

+

</button>






</div>










<div
class="sheet"
id="add-sheet">





<div
class="sheet-bg"
onclick="closeAddReminder()">
</div>








<div class="sheet-box">



<h2>
Новое напоминание
</h2>





<input

id="reminder-text"

type="text"

autocomplete="off"

inputmode="text"

placeholder="Что нужно сделать?"

>







<input

id="reminder-date"

type="date"

autocomplete="off"

>







<input

id="reminder-time"

type="time"

autocomplete="off"

>








<button

type="button"

class="save-button"

onclick="saveReminder()">

Создать

</button>







</div>






</div>









<script
type="module"
src="./js/add.js">
</script>



<script
type="module"
src="./js/app.js">
</script>






<script>


document.addEventListener(
"DOMContentLoaded",
()=>{


const date =
document.getElementById(
"reminder-date"
);


const time =
document.getElementById(
"reminder-time"
);



const now =
new Date();



if(date){


const year =
now.getFullYear();


const month =
String(
now.getMonth()+1
)
.padStart(2,"0");


const day =
String(
now.getDate()
)
.padStart(2,"0");



date.min =
`${year}-${month}-${day}`;



date.value =
`${year}-${month}-${day}`;


}





if(time){


now.setHours(
now.getHours()+1
);



time.value =
now.toTimeString()
.slice(0,5);


}



});


</script>







</body>

</html>
