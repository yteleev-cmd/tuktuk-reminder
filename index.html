<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Тук-Тук</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link rel="stylesheet" href="./css/style.css">

</head>


<body>


<div class="app">


<header class="header">


<div class="logo">


<div class="logo-icon">
🔔
</div>



<div>


<div class="logo-title">
Тук-Тук
</div>


<div class="logo-subtitle">
Мои напоминания
</div>


</div>


</div>




<button class="refresh"
onclick="loadReminders()">

↻

</button>


</header>





<div class="tabs">


<button
class="tab active"
onclick="setTab('all',this)">

Все

</button>




<button
class="tab"
onclick="setTab('today',this)">

Сегодня

</button>




<button
class="tab"
onclick="setTab('future',this)">

Позже

</button>


</div>





<main id="content">

<div class="loader"></div>

</main>





<button
class="add-button"
onclick="openAddReminder()">

+

</button>



</div>




<script
type="module"
src="./js/app.js">
</script>



</body>

</html>
