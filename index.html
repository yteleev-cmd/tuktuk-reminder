<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"

>

<title>Тук-Тук</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #7b8494;
    --accent: #5b6ee1;
    --accent-soft: #e9ecff;
    --danger: #e45b5b;
    --danger-soft: #ffe9e9;
    --border: #e5e8ef;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
    var(
        --tg-theme-bg-color,
        var(--bg)
    );

    color:
    var(
        --tg-theme-text-color,
        var(--text)
    );
}

.app {

    width: 100%;

    max-width: 650px;

    margin: auto;

    padding: 18px 14px 100px;

}

/* HEADER */

.header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 22px;

}

.logo {

    display: flex;

    align-items: center;

    gap: 12px;

}

.logo-icon {

    width: 52px;

    height: 52px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    border-radius: 18px;

    background:
    linear-gradient(
        135deg,
        #6677ed,
        #8b63e8
    );

    box-shadow:
    0 8px 22px
    rgba(
        91,
        110,
        225,
        .28
    );

}

.logo-title {

    font-size: 23px;

    font-weight: 800;

}

.logo-subtitle {

    margin-top: 3px;

    font-size: 13px;

    color: var(--muted);

}

.refresh {

    width: 44px;

    height: 44px;

    border: 0;

    border-radius: 15px;

    font-size: 20px;

    cursor: pointer;

    background: var(--card);

    color: var(--text);

    box-shadow:
    0 4px 16px
    rgba(
        20,
        30,
        60,
        .08
    );

}

/* TABS */

.tabs {

    display: flex;

    gap: 8px;

    margin-bottom: 22px;

}

.tab {

    flex: 1;

    padding: 11px 8px;

    border: 0;

    border-radius: 14px;

    background: var(--card);

    color: var(--muted);

    font-size: 14px;

    font-weight: 700;

}

.tab.active {

    background: var(--accent);

    color: white;

}

/* SECTION */

.section {

    margin-top: 26px;

}

.section-title {

    display: flex;

    align-items: center;

    gap: 8px;

    margin: 0 4px 11px;

    font-size: 15px;

    font-weight: 800;

}

.section-count {

    margin-left: auto;

    padding: 3px 9px;

    border-radius: 20px;

    background: var(--accent-soft);

    color: var(--accent);

    font-size: 12px;

}

/* CARD */

.reminder {

    margin-bottom: 10px;

    padding: 15px;

    border:
    1px solid
    var(--border);

    border-radius: 19px;

    background: var(--card);

    box-shadow:
    0 5px 18px
    rgba(
        20,
        30,
        60,
        .05
    );

}

.reminder.overdue {

    border-left:
    5px solid
    var(--danger);

}

.reminder-top {

    display: flex;

    align-items: flex-start;

    gap: 12px;

}

.reminder-icon {

    width: 43px;

    height: 43px;

    flex: 0 0 auto;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 14px;

    background:
    var(--accent-soft);

    font-size: 21px;

}

.reminder.overdue
.reminder-icon {

    background:
    var(--danger-soft);

}

.reminder-content {

    flex: 1;

    min-width: 0;

}

.reminder-text {

    font-size: 16px;

    font-weight: 750;

    line-height: 1.35;

    word-break: break-word;

}

.reminder-date {

    margin-top: 6px;

    color: var(--muted);

    font-size: 13px;

}

.reminder-actions {

    display: flex;

    gap: 8px;

    margin-top: 14px;

}

.done {

    flex: 1;

    border: 0;

    padding: 10px;

    border-radius: 12px;

    background:
    var(--accent-soft);

    color:
    var(--accent);

    font-size: 13px;

    font-weight: 750;

}

.more {

    width: 42px;

    border: 0;

    border-radius: 12px;

    background: #f1f3f7;

    font-size: 18px;

}

/* STATES */

.state {

    padding: 55px 20px;

    text-align: center;

    color: var(--muted);

}

.state-icon {

    font-size: 50px;

    margin-bottom: 14px;

}

.state-title {

    color: var(--text);

    font-size: 18px;

    font-weight: 800;

}

.state-text {

    margin-top: 7px;

    font-size: 14px;

}

.loader {

    width: 35px;

    height: 35px;

    margin: 35px auto;

    border:
    4px solid
    var(--accent-soft);

    border-top-color:
    var(--accent);

    border-radius: 50%;

    animation:
    spin .8s linear infinite;

}

@keyframes spin {

    to {

        transform:
        rotate(360deg);

    }

}

</style>

</head>

<body>

<div class="app">

<header class="header">

<div class="logo">

<div class="logo-icon">
🔔
</div>

<div>

<div class="logo-title">
Тук-Тук TEST 123
</div>

<div class="logo-subtitle">
Мои напоминания
</div>

</div>

</div>

<button
class="refresh"
onclick="loadReminders()"

>

↻ </button>

</header>

<div class="tabs">

<button
class="tab active"
onclick="setTab(
'all',
this
)"

>

Все </button>

<button
class="tab"
onclick="setTab(
'today',
this
)"

>

Сегодня </button>

<button
class="tab"
onclick="setTab(
'future',
this
)"

>

Позже </button>

</div>

<main id="content">

<div class="loader"></div>

</main>

</div>

<script>

const WEBHOOK_URL =
"https://hook.eu1.make.com/wfwptrf4nlkieqbdxoeci4mcce8t0ht3";

let reminders = [];

let currentTab =
"all";

/* TELEGRAM */

const tg =
window.Telegram
?
window.Telegram.WebApp
:
null;

if (tg) {

    tg.ready();

    tg.expand();

}

/* USER */

function getUserId() {

    if (

        tg

        &&

        tg.initDataUnsafe

        &&

        tg.initDataUnsafe.user

    ) {

        return String(

            tg
            .initDataUnsafe
            .user
            .id

        );

    }

    /* ТЕСТ В ОБЫЧНОМ БРАУЗЕРЕ */

    return
    "264483752";

}

/* LOAD */

async function loadReminders() {

    const content =

    document
    .getElementById(
        "content"
    );

    content.innerHTML =

    '<div class="loader"></div>';

    try {

        const response =

        await fetch(

            WEBHOOK_URL,

            {

                method:
                "POST",

                headers:
                {

                    "Content-Type":
                    "application/json"

                },

                body:

                JSON.stringify({

                    user_id:
                    getUserId()

                })

            }

        );

        const responseText =

        await response.text();

        let data;

        try {

            data =

            JSON.parse(
                responseText
            );

        }

        catch {

            throw new Error(

                "Make вернул не JSON: "

                +

                responseText

            );

        }

        /* ЕСЛИ ВЕСЬ ОТВЕТ ПРИШЁЛ СТРОКОЙ */

        if (

            typeof data

            ===

            "string"

        ) {

            data =

            JSON.parse(
                data
            );

        }

        if (

            !data

            ||

            !data.success

        ) {

            throw new Error(

                "Некорректный ответ Make"

            );

        }

        let received =

        data.reminders

        ||

        [];

        /* ЕСЛИ reminders ПРИШЁЛ СТРОКОЙ */

        if (

            typeof received

            ===

            "string"

        ) {

            received =

            JSON.parse(
                received
            );

        }

        /* ЕСЛИ КАЖДОЕ НАПОМИНАНИЕ ПРИШЛО СТРОКОЙ */

        reminders =

        received.map(

            item => {

                if (

                    typeof item

                    ===

                    "string"

                ) {

                    return

                    JSON.parse(
                        item
                    );

                }

                return item;

            }

        );

        sortReminders();

        render();

    }

    catch (

        error

    ) {

        console.error(

            "Ошибка Mini App:",

            error

        );

        content.innerHTML =

        `

        <div class="state">

        <div class="state-icon">
        ⚠️
        </div>

        <div class="state-title">

        Не удалось загрузить

        </div>

        <div class="state-text">

        ${escapeHtml(

            error.message

        )}

        </div>

        </div>

        `;

    }

}

/* SORT */

function sortReminders() {

    reminders.sort(

        function(

            a,

            b

        ) {

            return

            getDate(a)

            -

            getDate(b);

        }

    );

}

/* TAB */

function setTab(

    tab,

    button

) {

    currentTab =

    tab;

    document

    .querySelectorAll(

        ".tab"

    )

    .forEach(

        item =>

        item.classList

        .remove(

            "active"

        )

    );

    button

    .classList

    .add(

        "active"

    );

    render();

}

/* DATE */

function getDate(

    reminder

) {

    return new Date(

        String(

            reminder.date

            ||

            ""

        )

        +

        "T"

        +

        String(

            reminder.time

            ||

            "00:00"

        )

    );

}

function isToday(

    date

) {

    const now =

    new Date();

    return

    date.getFullYear()

    ===

    now.getFullYear()

    &&

    date.getMonth()

    ===

    now.getMonth()

    &&

    date.getDate()

    ===

    now.getDate();

}

/* RENDER */

function render() {

    const content =

    document

    .getElementById(

        "content"

    );

    const now =

    new Date();

    const filtered =

    reminders.filter(

        reminder => {

            const date =

            getDate(

                reminder

            );

            if (

                currentTab

                ===

                "today"

            ) {

                return

                isToday(

                    date

                );

            }

            if (

                currentTab

                ===

                "future"

            ) {

                return

                date >= now

                &&

                !isToday(

                    date

                );

            }

            return true;

        }

    );

    if (

        filtered.length

        ===

        0

    ) {

        content.innerHTML =

        `

        <div class="state">

        <div class="state-icon">
        🎉
        </div>

        <div class="state-title">

        Напоминаний нет

        </div>

        <div class="state-text">

        Всё спокойно

        </div>

        </div>

        `;

        return;

    }

    const overdue =

    filtered.filter(

        reminder =>

        getDate(

            reminder

        )

        <

        now

    );

    const today =

    filtered.filter(

        reminder =>

        isToday(

            getDate(

                reminder

            )

        )

        &&

        getDate(

            reminder

        )

        >=

        now

    );

    const future =

    filtered.filter(

        reminder =>

        !isToday(

            getDate(

                reminder

            )

        )

        &&

        getDate(

            reminder

        )

        >=

        now

    );

    let html =

    "";

    if (

        overdue.length

    ) {

        html +=

        section(

            "🔴",

            "Просрочено",

            overdue,

            true

        );

    }

    if (

        today.length

    ) {

        html +=

        section(

            "🟡",

            "Сегодня",

            today

        );

    }

    if (

        future.length

    ) {

        html +=

        section(

            "🟢",

            "Позже",

            future

        );

    }

    content.innerHTML =

    html;

}

/* SECTION */

function section(

    icon,

    title,

    items,

    overdue = false

) {

    return

    `

    <section class="section">

    <div class="section-title">

    ${icon}

    ${title}

    <span class="section-count">

    ${items.length}

    </span>

    </div>

    ${

        items

        .map(

            item =>

            card(

                item,

                overdue

            )

        )

        .join(

            ""

        )

    }

    </section>

    `;

}

/* CARD */

function card(item, overdue) {

    console.log(
        "Карточка получила:",
        item
    );

    const text =
        item?.text
        ??
        "Без текста";

    const date =
        item?.date
        ??
        "";

    const time =
        item?.time
        ??
        "";

    return `

    <article class="reminder ${overdue ? "overdue" : ""}">

        <div class="reminder-top">

            <div class="reminder-icon">
                🔔
            </div>

            <div class="reminder-content">

                <div class="reminder-text">
                    ${text}
                </div>

                <div class="reminder-date">
                    📅 ${date}
                    ·
                    ⏰ ${time}
                </div>

            </div>

        </div>

        <div class="reminder-actions">

            <button
                class="done"
                onclick="completeReminder('${item?.id ?? ""}')"
            >
                ✓ Выполнено
            </button>

            <button class="more">
                ⋮
            </button>

        </div>

    </article>

    `;

}

/* COMPLETE */

function completeReminder(

    id

) {

    alert(

        "Позже здесь будет "

        +

        "отметка выполнения. "

        +

        "ID: "

        +

        id

    );

}

/* ESCAPE */

function escapeHtml(

    value

) {

    const div =

    document

    .createElement(

        "div"

    );

    div.textContent =

    String(

        value

        ??

        ""

    );

    return

    div.innerHTML;

}

function escapeAttribute(

    value

) {

    return escapeHtml(

        value

    )

    .replace(

        /"/g,

        "&quot;"

    )

    .replace(

        /'/g,

        "&#39;"

    );

}

/* START */

loadReminders();

</script>

</body>

</html>
